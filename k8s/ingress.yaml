apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-subodh
  namespace: test-subodh
  annotations:
    # k3s uses Traefik by default — no extra annotation needed for basic HTTP
    # Uncomment below if you use cert-manager for TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: clinic.yourdomain.com   # replace with your domain or server IP
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-subodh
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - clinic.yourdomain.com
  #     secretName: test-subodh-tls
